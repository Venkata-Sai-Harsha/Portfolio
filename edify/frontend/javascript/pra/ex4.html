<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .product-card {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            width: 300px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 180px;
            border-radius: 8px;
            text-align: center;
        }

        .product-card h2 {
            font-size: 1.1em;
            margin: 10px 0 8px;
        }

        .product-card .price,
        .product-card .category,
        .product-card .rating {
            margin: 4px 0;
            font-weight: 500;
        }

        .product-card .description {
            color: #555;
            font-size: 0.95em;
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="product-container" id="products-container">

    </div>
    <script>

        var loginPromiseObj = new Promise(function (resolve, reject) {
            var isCrentialMatching = false;

            if (isCrentialMatching) {
                resolve('Valid credentials');
            } else {
                reject('Invalid credentials');
            }
        });

        loginPromiseObj.then(function (result) {
            console.log(result);
        }).catch(function (error) {
            console.log(error);
        });

        var products = [];

        fetch('https://fakestoreapi.com/products', {
            method: 'GET'
        }).then(function (response) {
            return response.json();
        }).then(function (parsedResponse) {
            products = parsedResponse;
            displayProducts();
        }).catch(function (error) {
            console.log(error);
        });

        function displayProducts() {
            var productsContainerDiv = document.getElementById('products-container');
            var productsStr = '';

            products.forEach(function(product) {
                productsStr += `
                    <div class="product-card">
                        <img src="${product.image}" alt="Fjallraven Backpack" width="150px">
                        <h2>${product.title}</h2>
                        <p class="price"><strong>Price:</strong> $${product.price}</p>
                        <p class="category"><strong>Category:</strong> ${product.category}</p>
                        <p class="description">${product.description}</p>
                        <p class="rating"><strong>Rating:</strong> ⭐ ${product.rating.rate} (${product.rating.count} reviews)</p>
                    </div>
                `;
            });

            productsContainerDiv.innerHTML = productsStr;
        }


    </script>
</body>

</html>
