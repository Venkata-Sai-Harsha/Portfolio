<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="mb-4">Add / Edit Product</h2>
        <div>
            <div class="mb-3">
                <label for="title" class="form-label">Product Title</label>
                <input type="text" class="form-control" id="title" placeholder="Enter product title">
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price ($)</label>
                <input type="number" class="form-control" id="price" step="0.01" placeholder="Enter price">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Enter description"></textarea>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <input type="text" class="form-control" id="category" placeholder="e.g., men's clothing">
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="image" placeholder="Enter image URL">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="rate" class="form-label">Rating (Rate)</label>
                    <input type="number" step="0.1" class="form-control" id="rate" placeholder="e.g., 3.9">
                </div>
                <div class="col-md-6">
                    <label for="count" class="form-label">Rating (Count)</label>
                    <input type="number" class="form-control" id="count" placeholder="e.g., 120">
                </div>
            </div>

            <button type="button" class="btn btn-primary" onclick="addProduct()">Submit</button>
        </div>
    </div>

    <script>

        var urlParams = new URLSearchParams(window.location.search);
        var productId = urlParams.get('productId');


        function addProduct() {

            var requestBody = {
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                image: document.getElementById('image').value,
                rating: {
                    rate: document.getElementById('rate').value,
                    count: document.getElementById('count').value
                }
            };

            requestBody = JSON.stringify(requestBody);

            if (productId) {
                fetch('http://localhost:4000/products/' + productId, {
                    method: 'PUT',
                    contentType: 'application/json',
                    body: requestBody
                }).then(function(response) {
                    return response.json();
                }).then(function(parsedResponse) {
                    window.alert('Product updated successfully');
                    window.location.href = './22.5.25.html';
                }).catch(function(error) {

                });
            } else {
                fetch('http://localhost:4000/products', {
                    method: 'POST',
                    contentType: 'application/json',
                    body: requestBody
                }).then(function(response) {
                    return response.json();
                }).then(function(parsedResponse) {
                    window.alert('Product added successfully');
                    window.location.href = './22.5.25.html';
                }).catch(function(error) {

                });
            }

        }

        if (productId) {
            fetch('http://localhost:4000/products/' + productId, {
                method: 'GET'
            }).then(function(response) {
                return response.json();
            }).then(function(parsedResponse) {
                document.getElementById('title').value = parsedResponse.title;
                document.getElementById('price').value = parsedResponse.price;
                document.getElementById('description').value = parsedResponse.description;
                document.getElementById('category').value = parsedResponse.category;
                document.getElementById('image').value = parsedResponse.image;
                document.getElementById('rate').value = parsedResponse.rating.rate;
                document.getElementById('count').value = parsedResponse.rating.count;
            }).catch(function(error) {

            });
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
