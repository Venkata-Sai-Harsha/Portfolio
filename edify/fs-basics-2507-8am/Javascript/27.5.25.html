<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <div class="container my-5">
        <div>
            <h2 class="text-center my-4 text-primary">Create Ship</h2>
            <div class="row">
                <div class="col-sm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name">
                    </div>
                    <div class="mb-3">
                        <label for="imoNumber" class="form-label">IMO No</label>
                        <input type="text" class="form-control" id="imoNumber">
                    </div>
                    <div class="mb-3">
                        <label for="flag" class="form-label">Flag</label>
                        <input type="text" class="form-control" id="flag">
                    </div>
                    <div class="mb-3">
                        <label>Status</label>
                        <select class="form-select" id="status">
                            <option selected>Select Status</option>
                            <option value="1">Active</option>
                            <option value="2">Under Maintenance</option>
                            <option value="3">Decommissioned</option>
                        </select>              
                    </div>
                </div>
                <div class="col-sm">
                    <div class="mb-3">
                        <label class="mb-2">Type</label>
                        <select class="form-select" id="type">
                            <option selected>Select Type</option>
                            <option value="1">Cargo</option>
                            <option value="2">Tanker</option>
                            <option value="3">Passenger</option>
                        </select>              
                    </div>
                    <div class="mb-3">
                        <label for="yearBuilt" class="form-label">Year Built</label>
                        <input type="text" class="form-control" id="yearBuilt">
                    </div>
                    <div class="mb-3">
                        <label for="owner" class="form-label">Owner</label>
                        <input type="text" class="form-control" id="owner">
                    </div>
                </div>
            </div>
            <button class="btn btn-success mt-2" onclick="createShip()">Create</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script>

        function createShip() {

            var requestBody = {
                name: document.getElementById('name').value,
                imoNumber: document.getElementById('imoNumber').value,
                flag: document.getElementById('flag').value,
                status: document.getElementById('status').value,
                type: document.getElementById('type').value,
                yearBuilt: document.getElementById('yearBuilt').value,
                owner: document.getElementById('owner').value,
            };

            fetch('http://localhost:4000/ships', {
                method: 'POST',
                contentType: 'application/json',
                body: JSON.stringify(requestBody)
            }).then(function(response) {
                return response.json()
            }).then(function(parsedResponse) {
                window.alert('Ship created successfully');
            }).catch(function(error) {

            });

        }



    </script>
</body>

</html>
